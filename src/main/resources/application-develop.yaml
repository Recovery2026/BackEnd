spring:
  application:
    name: "recovery"
  datasource:
    driver-class-name: "org.postgresql.Driver"
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
